<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专升本考试成绩查询</title>
<style>
  :root{
    --brand:#1a5fb4;
    --brand-2:#2f7de1;
    --ok:#1f9d55;
    --fail:#d9480f;
    --ink:#1f2733;
    --muted:#6b7684;
    --line:#e3e8ef;
    --bg:#eef2f7;
    --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    background:linear-gradient(160deg,#e9f0f9 0%,#f4f7fb 40%,#eef2f7 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px 60px;
  }
  .wrap{width:100%;max-width:820px;}

  /* Header */
  .head{
    background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
    color:#fff;
    border-radius:16px 16px 0 0;
    padding:28px 32px;
    box-shadow:0 10px 30px rgba(26,95,180,.18);
    display:flex;
    align-items:center;
    gap:18px;
  }
  .emblem{
    width:52px;height:52px;flex:0 0 52px;border-radius:50%;
    background:rgba(255,255,255,.16);
    border:2px solid rgba(255,255,255,.55);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
  }
  .head h1{font-size:22px;font-weight:700;letter-spacing:.5px;}
  .head p{font-size:13px;opacity:.85;margin-top:4px;letter-spacing:2px;}

  /* Card body */
  .card{
    background:var(--card);
    border-radius:0 0 16px 16px;
    box-shadow:0 18px 50px rgba(24,44,74,.10);
    overflow:hidden;
  }

  /* Candidate info */
  .candidate{
    padding:26px 32px 6px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px 28px;
    border-bottom:1px solid var(--line);
    padding-bottom:24px;
  }
  .field .label{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;}
  .field .value{font-size:16px;font-weight:600;color:var(--ink);word-break:break-all;}
  .field .value.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;letter-spacing:.5px;}

  /* Results */
  .results-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 32px 12px;
  }
  .results-head h2{font-size:16px;font-weight:700;color:var(--ink);}
  .results-head .sub{font-size:12px;color:var(--muted);}

  table{width:100%;border-collapse:collapse;}
  thead th{
    font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px;
    text-align:left;padding:10px 32px;background:#f7f9fc;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  thead th.center{text-align:center;}
  tbody td{
    padding:18px 32px;font-size:15px;border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fafcff;}
  td.idx{color:var(--muted);font-size:13px;width:72px;}
  thead th:first-child{width:72px;white-space:nowrap;}
  td.subject{font-weight:600;}
  td.center{text-align:center;}

  .score{
    display:inline-flex;align-items:baseline;gap:2px;
    font-variant-numeric:tabular-nums;
  }
  .score .num{font-size:22px;font-weight:700;color:var(--ink);}
  .score .num.pass{color:var(--ok);}
  .score .num.fail{color:var(--fail);}

  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;
  }
  .badge.pass{color:var(--ok);background:#e7f6ec;}
  .badge.fail{color:var(--fail);background:#fdece4;}
  .dot{width:7px;height:7px;border-radius:50%;}
  .badge.pass .dot{background:var(--ok);}
  .badge.fail .dot{background:var(--fail);}

  .remark{font-size:12px;color:var(--muted);padding:0 32px 12px;}

  /* Footer */
  .foot{
    padding:20px 32px 28px;display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
  }
  .foot .note{font-size:12px;color:var(--muted);line-height:1.7;}
  .foot .seal{
    font-size:12px;color:var(--brand);border:1px solid #cfe0f5;background:#f2f8ff;
    padding:6px 12px;border-radius:8px;letter-spacing:1px;
  }

  /* Back bar */
  .backbar{
    padding:0 32px 26px;
  }
  .btn-back{
    display:inline-flex;align-items:center;gap:6px;
    text-decoration:none;color:var(--brand);
    font-size:14px;font-weight:600;
    padding:9px 18px;border-radius:9px;
    border:1px solid #cfe0f5;background:#f2f8ff;
    transition:background .15s ease,transform .15s ease,box-shadow .15s ease;
  }
  .btn-back:hover{background:#e4f0ff;box-shadow:0 4px 12px rgba(26,95,180,.12);}
  .btn-back:active{transform:translateY(1px);}

  @media(max-width:640px){
    .candidate{grid-template-columns:1fr;}
    thead th,tbody td{padding-left:18px;padding-right:18px;}
    .head{padding:22px 20px;}
    .candidate,.results-head,.foot{padding-left:20px;padding-right:20px;}
    .remark{padding-left:20px;padding-right:20px;}
    .field .value{font-size:15px;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="emblem">🎓</div>
      <div>
        <h1>专升本考试成绩单</h1>
        <p>高等教育自学考试 · 成绩查询</p>
      </div>
    </div>

    <div class="card">
      <div class="candidate">
        <div class="field">
          <div class="label">姓名</div>
          <div class="value">朱佳怡</div>
        </div>
        <div class="field">
          <div class="label">身份证号</div>
          <div class="value mono">310113200407065524</div>
        </div>
        <div class="field">
          <div class="label">考试科目数</div>
          <div class="value">4 门</div>
        </div>
      </div>

      <div class="results-head">
        <h2>各科成绩</h2>
        <span class="sub">满分 100 分 · 60 分合格</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>序号</th>
            <th>考试科目</th>
            <th class="center">成绩</th>
            <th class="center">结果</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="idx">01</td>
            <td class="subject">经济学原理（中级）</td>
            <td class="center"><span class="score"><span class="num pass">60</span></span></td>
            <td class="center"><span class="badge pass"><span class="dot"></span>合格</span></td>
          </tr>
          <tr>
            <td class="idx">02</td>
            <td class="subject">管理系统中计算机应用</td>
            <td class="center"><span class="score"><span class="num pass">60</span></span></td>
            <td class="center"><span class="badge pass"><span class="dot"></span>合格</span></td>
          </tr>
          <tr>
            <td class="idx">03</td>
            <td class="subject">中国近代史</td>
            <td class="center"><span class="score"><span class="num pass">60</span></span></td>
            <td class="center"><span class="badge pass"><span class="dot"></span>合格</span></td>
          </tr>
          <tr>
            <td class="idx">04</td>
            <td class="subject">财务管理学</td>
            <td class="center"><span class="score"><span class="num fail">52</span></span></td>
            <td class="center"><span class="badge fail"><span class="dot"></span>不合格</span></td>
          </tr>
        </tbody>
      </table>

      <div class="foot">
        <div class="seal">成绩专用</div>
      </div>
      <div class="backbar">
        <a class="btn-back" href="index.html">← 返回查询入口</a>
      </div>
    </div>
  </div>
</body>
</html>
